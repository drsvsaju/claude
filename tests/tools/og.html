<!doctype html>
<!-- The link preview (1200×630) and the icons are drawn from this page by tools/mkassets.mjs. Open it with ?icon to see the icon alone. -->
<html lang="en"><head><meta charset="utf-8"><title>Pomodorolist preview</title>
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1f2322; background: #f6f6f3; }
  .og { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 440px; align-items: center;
        background: radial-gradient(900px 520px at 88% 12%, rgba(47, 143, 131, .16), transparent 62%), radial-gradient(700px 480px at 6% 100%, rgba(240, 115, 95, .13), transparent 60%), #f6f6f3; }
  .l { padding: 0 0 0 70px; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 650; letter-spacing: -.01em; }
  .brand svg { width: 68px; height: 68px; }
  h1 { margin: 40px 0 26px; font-size: 86px; line-height: 1.02; font-weight: 700; letter-spacing: -.035em; }
  h1 em { font-style: normal; color: #24756b; }
  p { margin: 0; max-width: 600px; font-size: 34px; line-height: 1.3; color: #4c5451; }
  .chips { display: flex; gap: 12px; margin-top: 34px; }
  .chip { display: inline-flex; align-items: center; gap: 9px; padding: 11px 18px; border-radius: 999px; background: #fff; border: 1px solid #e5e5df; font-size: 21px; font-weight: 550; color: #2b312f; }
  .chip i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); }
  .r { position: relative; height: 100%; }
  .card { position: absolute; left: 0; top: 96px; width: 392px; height: 438px; border-radius: 34px; background: #fff; border: 1px solid #e5e5df; box-shadow: 0 30px 60px -28px rgba(31, 35, 34, .28), 0 2px 6px rgba(31, 35, 34, .05); display: grid; place-items: center; }
  .ring { position: relative; width: 300px; height: 300px; }
  .ring svg { width: 300px; height: 300px; transform: rotate(-90deg); }
  .ring .t { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 6px; }
  .ring .lbl { font-size: 24px; color: #626a67; }
  .ring .time { font-size: 84px; font-weight: 300; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .ring .sub { font-size: 22px; color: #626a67; }
  .pom { position: absolute; left: -34px; top: 62px; width: 92px; height: 92px; filter: drop-shadow(0 10px 14px rgba(31, 35, 34, .18)); }
  /* the icon alone: a rounded square with the tomato, for the touch icon and the favicons */
  body.icon { width: 512px; height: 512px; background: transparent; }
  .ic { display: none; width: 512px; height: 512px; border-radius: var(--rad, 0); background: linear-gradient(160deg, #fbfbf8, #eef3f0); place-items: center; }
  .ic svg { width: 74%; height: 74%; }
  body.icon .og { display: none; } body.icon .ic { display: grid; }
</style></head>
<body>
<div class="og">
  <div class="l">
    <div class="brand"><svg viewBox="0 0 32 32"><use href="#pom"/></svg>Pomodorolist</div>
    <h1>Focus that feels<br>like <em>progress.</em></h1>
    <p>A calm study timer. Free, no ads.</p>
  </div>
  <div class="r">
    <div class="card">
      <div class="ring">
        <svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="132" fill="none" stroke="#e9ece8" stroke-width="10"/><circle cx="150" cy="150" r="132" fill="none" stroke="#2f8f83" stroke-width="10" stroke-linecap="round" stroke-dasharray="829.4" stroke-dashoffset="290"/></svg>
        <div class="t"><div class="lbl">Focus</div><div class="time">16:15</div><div class="sub">Physics</div></div>
      </div>
    </div>
    <svg class="pom" viewBox="0 0 32 32"><use href="#pom"/></svg>
  </div>
</div>
<div class="ic"><svg viewBox="0 0 32 32"><use href="#pom"/></svg></div>
<svg width="0" height="0" style="position:absolute"><symbol id="pom" viewBox="0 0 32 32"><ellipse cx="16" cy="18.6" rx="12.6" ry="11.8" fill="#f0735f"/><path d="M16 7.6V5" stroke="#5a9a5c" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M16.4 6C17.6 2.8 21.2 1.9 24 3.2 22.7 6.1 19.2 7.4 16.4 6Z" fill="#7cc07a"/><circle cx="12.4" cy="18.6" r="1.6" fill="#3b2420"/><circle cx="19.6" cy="18.6" r="1.6" fill="#3b2420"/></symbol></svg>
<script>
  const q = new URLSearchParams(location.search);
  if (q.has('icon')) { document.body.classList.add('icon'); const ic = document.querySelector('.ic'); if (q.get('icon') === 'bare') { ic.style.background = 'none'; ic.querySelector('svg').style.cssText = 'width:100%;height:100%'; } }   // ?icon=square: on a light square (the touch icon); ?icon=bare: the tomato alone (the tab icon)
</script>
</body></html>
